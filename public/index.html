<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c2d48">
<title>StarLine Bills &amp; Expenses</title>
<link rel="icon" href="/logo.webp" type="image/webp">
<link rel="apple-touch-icon" href="/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy-deep:#061a2e; --navy:#0c2d48; --navy-2:#123a5e; --gold:#e8b636; --gold-light:#ffd76a;
  --page:#f2f5f9; --surface:#ffffff; --surface-2:#f6f8fb; --surface-3:#eaf0f6;
  --border:#e2e8ef; --border-2:#cfd9e4;
  --ink:#0f2235; --ink-2:#44596e; --muted:#687d92;
  --link:#1a5a8c; --brand-wash:#e8f0f8; --brand-ink:#0c2d48;
  --pri-bg:#0c2d48; --pri-ink:#ffffff; --pri-hover:#123a5e;
  --gold-ink:#8a6200; --gold-wash:#fcf4dc;
  --good:#1f9d55; --good-ink:#15703c; --good-wash:#e4f5eb;
  --warn:#e5a11a; --warn-ink:#8a5a00; --warn-wash:#fdf3dc;
  --crit:#d64545; --crit-ink:#a52525; --crit-wash:#fbe9e9;
  --s1:#0c2d48; --s2:#d9a521;
  --grid:#e6ecf2; --axis:#c8d3de;
  --shadow:0 1px 2px rgba(6,26,46,.05), 0 16px 32px -22px rgba(6,26,46,.35);
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#06111d; --surface:#0b1a2a; --surface-2:#0f2236; --surface-3:#152c45;
    --border:#1a2f46; --border-2:#28425e;
    --ink:#e9f0f7; --ink-2:#a7b8ca; --muted:#7c91a7;
    --link:#ffd76a; --brand-wash:#132c46; --brand-ink:#ffd76a;
    --pri-bg:#e8b636; --pri-ink:#061a2e; --pri-hover:#ffd76a;
    --gold-ink:#ffd76a; --gold-wash:#2a2412;
    --good:#2fb36a; --good-ink:#6fd59a; --good-wash:#0f2a1e;
    --warn:#e5a11a; --warn-ink:#f0c060; --warn-wash:#2b2312;
    --crit:#e05f5f; --crit-ink:#f08b8b; --crit-wash:#2e1719;
    --s1:#5b9bd5; --s2:#e8b636;
    --grid:#16293e; --axis:#2a425c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 32px -22px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#06111d; --surface:#0b1a2a; --surface-2:#0f2236; --surface-3:#152c45;
  --border:#1a2f46; --border-2:#28425e;
  --ink:#e9f0f7; --ink-2:#a7b8ca; --muted:#7c91a7;
  --link:#ffd76a; --brand-wash:#132c46; --brand-ink:#ffd76a;
  --pri-bg:#e8b636; --pri-ink:#061a2e; --pri-hover:#ffd76a;
  --gold-ink:#ffd76a; --gold-wash:#2a2412;
  --good:#2fb36a; --good-ink:#6fd59a; --good-wash:#0f2a1e;
  --warn:#e5a11a; --warn-ink:#f0c060; --warn-wash:#2b2312;
  --crit:#e05f5f; --crit-ink:#f08b8b; --crit-wash:#2e1719;
  --s1:#5b9bd5; --s2:#e8b636;
  --grid:#16293e; --axis:#2a425c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 32px -22px rgba(0,0,0,.85);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:"Open Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Montserrat","Open Sans",system-ui,sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--link)}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
.eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-ink); font-weight:700}

/* ---------- shell ---------- */
.shell{display:flex; min-height:100vh}
.side{
  width:248px; flex:0 0 248px; position:sticky; top:0; height:100vh;
  background:linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
  color:rgba(233,240,247,.78); display:flex; flex-direction:column;
}
.brandbox{padding:22px 20px 18px; border-bottom:1px solid rgba(255,255,255,.08)}
.mark{display:flex; align-items:center; gap:12px; text-decoration:none}
.mark img{width:42px; height:42px; border-radius:11px; flex:0 0 42px; box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.mark .nm{font-family:"Montserrat",sans-serif; font-weight:800; font-size:17px; letter-spacing:-.01em; color:#fff; line-height:1.15}
.mark .sub{font-size:10.5px; color:var(--gold); letter-spacing:.14em; text-transform:uppercase; font-weight:700; margin-top:2px}
.nav{padding:14px 12px; display:flex; flex-direction:column; gap:3px; flex:1; overflow:auto}
.nav .navlab{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(233,240,247,.4); font-weight:700; padding:12px 12px 6px}
.nav button{
  position:relative; display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  background:none; border:0; padding:10px 12px; border-radius:var(--r); cursor:pointer;
  color:rgba(233,240,247,.74); font-weight:600; font-size:13.5px;
  transition:background .12s ease, color .12s ease;
}
.nav button:hover{background:rgba(255,255,255,.06); color:#fff}
.nav button.on{background:rgba(232,182,54,.13); color:var(--gold-light)}
.nav button.on::before{content:""; position:absolute; left:-12px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--gold)}
.nav button .ic{width:18px; height:18px; flex:0 0 18px}
.nav .badge{margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--crit); color:#fff; font-size:11px; font-weight:700; display:inline-grid; place-items:center}
.sidefoot{padding:14px 16px; border-top:1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:10px}
.sidefoot .who{flex:1; min-width:0; font-size:12px; line-height:1.3}
.sidefoot .who b{display:block; color:#fff; font-weight:600; font-size:12.5px; overflow:hidden; text-overflow:ellipsis}
.sidefoot .btn{background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.14); color:#fff}
.sidefoot .btn:hover{background:rgba(255,255,255,.12)}

.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 28px; border-bottom:1px solid var(--border); background:var(--surface);
  position:sticky; top:0; z-index:20;
}
.topbar .grow{flex:1}
.topbar .monthpick{display:flex; align-items:center; gap:8px}
.topbar .monthpick span{font-size:12px; font-weight:600; color:var(--muted)}
.bell{position:relative}
.bell .dot{position:absolute; top:4px; right:5px; width:8px; height:8px; border-radius:50%; background:var(--crit); box-shadow:0 0 0 2px var(--surface)}
.page{padding:26px 28px 48px; max-width:1240px; width:100%}
.page > header{margin-bottom:22px}
.page > header h1{font-size:26px; font-weight:800; margin-top:4px}
.page > header p{margin:6px 0 0; color:var(--ink-2); max-width:70ch}

/* ---------- controls ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--border-2); background:var(--surface); color:var(--ink);
  padding:8px 14px; border-radius:var(--r); cursor:pointer; font-weight:600; font-size:13px; white-space:nowrap;
  transition:background .12s ease, border-color .12s ease, transform .06s ease;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pri-bg); border-color:var(--pri-bg); color:var(--pri-ink)}
.btn.pri:hover{background:var(--pri-hover); border-color:var(--pri-hover)}
.btn.gold{background:var(--gold); border-color:var(--gold); color:#061a2e}
.btn.gold:hover{background:var(--gold-light); border-color:var(--gold-light)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.sm{padding:5px 10px; font-size:12px}
.btn.danger{color:var(--crit-ink)}
.btn.danger:hover{background:var(--crit-wash)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.btn .ic{width:15px; height:15px}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:4px}

input[type=text],input[type=number],input[type=date],input[type=password],input[type=url],select,textarea{
  background:var(--surface); border:1px solid var(--border-2); border-radius:7px;
  padding:8px 10px; width:100%; min-width:0; transition:border-color .12s ease, box-shadow .12s ease;
}
textarea{resize:vertical; line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(232,182,54,.25)}
label.fld{display:flex; flex-direction:column; gap:6px; font-size:12px; font-weight:600; color:var(--ink-2)}
.hint{font-size:12px; color:var(--muted); font-weight:400}
.check{display:flex; align-items:flex-start; gap:9px; font-size:13px; color:var(--ink); font-weight:500; cursor:pointer}
.check input{width:16px; height:16px; margin:2px 0 0; accent-color:var(--navy); flex:0 0 16px}

.pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap}
.pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor}
.pill.paid,.pill.applied{background:var(--good-wash); color:var(--good-ink)}
.pill.pending,.pill.needs_review{background:var(--warn-wash); color:var(--warn-ink)}
.pill.overdue{background:var(--crit-wash); color:var(--crit-ink)}
.pill.blank,.pill.ignored,.pill.dismissed,.pill.duplicate{background:var(--surface-3); color:var(--muted)}
.tag{display:inline-block; padding:1px 7px; border-radius:5px; background:var(--surface-3); color:var(--ink-2); font-size:11px; font-weight:700}
.tag.fixed{background:var(--brand-wash); color:var(--brand-ink)}
.chip{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:6px; font-size:11.5px; font-weight:700; white-space:nowrap; border:1px solid transparent}
.chip .ic{width:12px; height:12px}
.chip.auto{background:var(--brand-wash); color:var(--brand-ink)}
.chip.gsched{background:var(--gold-wash); color:var(--gold-ink)}
.chip.pend{background:transparent; color:var(--warn-ink); border-color:var(--warn); border-style:dashed}
.chip.man{background:var(--surface-3); color:var(--ink-2)}

/* ---------- cards & grids ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:0 1px 0 rgba(6,26,46,.02)}
.card > .ch{display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap}
.card > .ch h3{font-size:14.5px; font-weight:700}
.card > .ch .sub{font-size:12px; color:var(--muted)}
.card > .ch .end{margin-left:auto; display:flex; gap:6px; align-items:center}
.card > .cb{padding:18px}
.grid{display:grid; gap:18px}
.grid > *{min-width:0}
.tiles{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cols2{grid-template-columns:1.3fr 1fr; align-items:start}
.cols2e{grid-template-columns:1fr 1fr; align-items:start}
.cols3{grid-template-columns:repeat(3,1fr)}
@media (max-width:1060px){.cols2,.cols2e{grid-template-columns:1fr}}
@media (max-width:760px){.cols3{grid-template-columns:1fr}}
.mb{margin-bottom:18px}

.tile{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; position:relative; overflow:hidden}
.tile .lab{font-size:12px; color:var(--ink-2); font-weight:600}
.tile .val{font-family:"Montserrat",sans-serif; font-size:clamp(20px,2vw,25px); font-weight:700; letter-spacing:-.02em; margin-top:6px; white-space:nowrap; font-variant-numeric:tabular-nums}
.tile .meta{font-size:12px; color:var(--muted); margin-top:4px}
.tile.hero{background:linear-gradient(135deg, var(--navy-2) 0%, var(--navy) 55%, var(--navy-deep) 100%); border-color:transparent; color:#fff}
.tile.hero .lab{color:rgba(255,255,255,.75)} .tile.hero .meta{color:rgba(255,255,255,.65)}
.tile.hero::after{content:""; position:absolute; right:-28px; top:-28px; width:120px; height:120px; border-radius:50%; border:16px solid rgba(232,182,54,.18)}
.meter{height:6px; border-radius:6px; background:var(--surface-3); overflow:hidden; margin-top:10px}
.meter span{display:block; height:100%; background:var(--gold); border-radius:6px}

.banner{display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:13px 16px; border-radius:12px; font-size:13px; border:1px solid transparent}
.banner .ic{width:20px; height:20px; flex:0 0 20px}
.banner .txt{flex:1 1 260px}
.banner b{font-weight:700}
.banner.crit{background:var(--crit-wash); color:var(--crit-ink)}
.banner.warn{background:var(--warn-wash); color:var(--warn-ink)}
.banner.info{background:var(--brand-wash); color:var(--brand-ink)}
.banner.good{background:var(--good-wash); color:var(--good-ink)}

/* ---------- tables ---------- */
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.dt{width:100%; border-collapse:collapse; font-size:13px; min-width:860px}
table.dt th{
  text-align:left; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
  font-weight:700; padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap; background:var(--surface-2);
}
table.dt th:first-child{border-top-left-radius:14px} table.dt th:last-child{border-top-right-radius:14px}
table.dt td{padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:middle}
table.dt tr:last-child td{border-bottom:0}
table.dt tbody tr:hover td{background:var(--surface-2)}
table.dt .r{text-align:right}
table.dt tr.grp td{background:var(--surface-3); font-weight:700; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); padding:7px 12px}
table.dt tr.tot td{border-top:2px solid var(--border-2); font-weight:700; background:var(--surface-2)}
table.dt input[type=number],table.dt input[type=date],table.dt select,table.dt input[type=text]{padding:5px 8px; font-size:13px}
table.dt .amt{width:120px}
table.dt .needs input{border-color:var(--warn); background:var(--warn-wash)}
.nm-cell{display:flex; flex-direction:column; gap:2px}
.nm-cell .n{font-weight:600}
.nm-cell .d{font-size:11.5px; color:var(--muted)}
.subline{display:block; font-size:11px; color:var(--muted); margin-top:2px}
.subline.ok{color:var(--good-ink); font-weight:600}
table.mini{width:100%; border-collapse:collapse; font-size:13px}
table.mini th,table.mini td{padding:8px 8px; border-bottom:1px solid var(--border); text-align:left}
table.mini tr:last-child td{border-bottom:0}
table.mini th{color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; font-weight:700}
table.mini .r{text-align:right}

/* ---------- schedule ---------- */
.sched{display:flex; flex-direction:column}
.sched .day{display:flex; gap:14px; padding:11px 0; border-bottom:1px solid var(--border)}
.sched .day:last-child{border-bottom:0}
.sched .when{flex:0 0 52px; text-align:center; border-radius:10px; background:var(--surface-2); padding:6px 0; align-self:flex-start}
.sched .when .m{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.sched .when .d{font-family:"Montserrat",sans-serif; font-size:19px; font-weight:800; line-height:1.1}
.sched .when.today{background:var(--pri-bg); color:var(--pri-ink)} .sched .when.today .m{color:inherit; opacity:.8}
.sched .when.late{background:var(--crit-wash); color:var(--crit-ink)} .sched .when.late .m{color:inherit}
.sched .items{flex:1; min-width:0; display:flex; flex-direction:column; gap:8px}
.sched .it{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.sched .it .nm{font-weight:600; flex:1 1 160px; min-width:0}
.sched .it .nm small{display:block; font-weight:400; font-size:11.5px; color:var(--muted)}
.sched .it .amt{font-weight:700; font-variant-numeric:tabular-nums}

.cov{display:flex; height:12px; gap:2px; border-radius:6px; overflow:hidden; margin:4px 0 12px}
.cov span{display:block; height:100%}
.legend{display:flex; gap:16px; flex-wrap:wrap; align-items:center}
.legend .lg{display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-2); font-weight:600}
.legend .sw{width:10px; height:10px; border-radius:3px; flex:0 0 10px}
.legend .swl{width:14px; height:3px; border-radius:2px; flex:0 0 14px}

/* ---------- charts ---------- */
.chartwrap{position:relative; margin-top:10px}
.chartwrap svg{display:block; width:100%; overflow:visible}
.tip{
  position:absolute; pointer-events:none; opacity:0; transform:translate(-50%,-100%);
  background:var(--surface); border:1px solid var(--border-2); border-radius:9px; padding:8px 11px;
  box-shadow:var(--shadow); font-size:12px; white-space:nowrap; z-index:30; transition:opacity .1s ease;
}
.tip .t{font-weight:700; margin-bottom:4px}
.tip .row{display:flex; gap:14px; justify-content:space-between; align-items:center}
.tip .row .k{display:inline-flex; align-items:center; gap:6px; color:var(--ink-2)}
.tip .row .sw{width:8px; height:8px; border-radius:2px}
details.tbl{margin-top:14px}
details.tbl summary{cursor:pointer; font-size:12px; color:var(--ink-2); font-weight:600}
.statusbar{display:flex; height:12px; gap:2px; margin:2px 0 14px; border-radius:6px; overflow:hidden}
.statusbar span{display:block}

/* ---------- login ---------- */
.gate{min-height:100vh; display:grid; grid-template-columns:1.05fr 1fr; background:var(--page)}
.gate .hero{
  position:relative; overflow:hidden; color:#fff; padding:56px 56px 40px; display:flex; flex-direction:column; justify-content:space-between;
  background:radial-gradient(120% 90% at 85% 10%, rgba(232,182,54,.16) 0%, rgba(232,182,54,0) 55%), linear-gradient(160deg, var(--navy-2) 0%, var(--navy) 45%, var(--navy-deep) 100%);
}
.gate .hero::before{content:""; position:absolute; right:-140px; bottom:-140px; width:420px; height:420px; border-radius:50%; border:40px solid rgba(232,182,54,.08)}
.gate .hero img{width:96px; height:96px; border-radius:22px; box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}
.gate .hero h2{font-size:clamp(26px,3vw,36px); font-weight:800; line-height:1.15; margin:26px 0 12px; max-width:16ch}
.gate .hero h2 em{font-style:normal; color:var(--gold)}
.gate .hero p{color:rgba(233,240,247,.78); max-width:44ch; margin:0; font-size:14.5px}
.gate .hero ul{list-style:none; padding:0; margin:28px 0 0; display:flex; flex-direction:column; gap:12px}
.gate .hero li{display:flex; gap:10px; align-items:flex-start; color:rgba(233,240,247,.9); font-size:13.5px}
.gate .hero li .ic{width:18px; height:18px; color:var(--gold); flex:0 0 18px; margin-top:1px}
.gate .hero .fine{font-size:11.5px; color:rgba(233,240,247,.5); margin-top:32px}
.gate .formside{display:grid; place-items:center; padding:32px 24px}
.gate .box{width:100%; max-width:380px}
.gate .box h1{font-size:24px; font-weight:800; margin-bottom:6px}
.gate .box p.sub{color:var(--ink-2); margin:0 0 26px; font-size:13.5px}
.gate form{display:flex; flex-direction:column; gap:16px}
.gate input{padding:11px 12px; font-size:14px}
.gate .err{color:var(--crit-ink); font-size:12.5px; font-weight:600; min-height:18px}
.gate .btn{padding:12px; font-size:14px}
.gate .foot{margin-top:24px; padding-top:16px; border-top:1px solid var(--border); font-size:12px; color:var(--muted); line-height:1.55}
@media (max-width:880px){
  .gate{grid-template-columns:1fr}
  .gate .hero{padding:32px 24px 28px}
  .gate .hero img{width:64px; height:64px; border-radius:16px}
  .gate .hero h2{margin-top:18px}
  .gate .hero ul,.gate .hero .fine{display:none}
}

/* ---------- modal ---------- */
.modal{position:fixed; inset:0; background:rgba(6,17,29,.55); display:grid; place-items:center; padding:20px; z-index:100; backdrop-filter:blur(2px)}
.modal .box{background:var(--surface); border:1px solid var(--border); border-radius:16px; width:100%; max-width:560px; box-shadow:var(--shadow); max-height:90vh; display:flex; flex-direction:column}
.modal .box.wide{max-width:760px}
.modal .mh{padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px}
.modal .mh h3{font-size:16px; flex:1}

<body>
<div id="root"></div>
<script>
(function(){
'use strict';

/* ============================ constants ============================ */
var MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var MNS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DRAFT_KEY = 'starline_ledger_draft_v1';
var PAY_MODES = [['auto-debit','Bank auto-debit (ADA)'],['scheduled','GCash scheduled payment'],['manual','I pay it myself each month']];

/* ============================ state ============================ */
var S = null;
var VIEW = 'dashboard';
var MK = null;
var REPMODE = 'month';
var DIRTY = false;
var AUTHED = false;
var GATE_USER = 'admin';
var TOAST_T = null;
var AUTO = null;          // /api/automation payload
var AUTO_ERR = '';
var SETTINGS = null;      // /api/settings/automation payload
var RECEIPT = null;       // parsed pasted receipt awaiting confirmation

/* ============================ helpers ============================ */
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uid(){ return 'x' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function cur(){ return (S && S.meta && S.meta.currency) || '₱'; }
function n2(v){ return (Number(v)||0).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function money(v){ return cur() + n2(v); }
function moneyShort(v){
  var n = Number(v)||0, a = Math.abs(n);
  if(a >= 1e6) return cur() + (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  if(a >= 1e3) return cur() + Math.round(n/1e3) + 'k';
  return cur() + Math.round(n);
}
function todayKey(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mLabel(k){ if(!k) return ''; var p=k.split('-'); return MN[Number(p[1])-1]+' '+p[0]; }
function daysIn(k){ var p=k.split('-'); return new Date(Number(p[0]), Number(p[1]), 0).getDate(); }
function dueISO(k, day){
  if(!day) return '';
  var p = k.split('-'), d = Math.min(Number(day), daysIn(k));
  return p[0]+'-'+p[1]+'-'+String(d).padStart(2,'0');
}
function fmtDate(iso){
  if(!iso) return '';
  var p = String(iso).slice(0,10).split('-');
  if(p.length!==3) return iso;
  return MNS[Number(p[1])-1]+' '+Number(p[2]);
}
function fmtWhen(ts){
  if(!ts) return '';
  var d = new Date(ts);
  return MNS[d.getMonth()]+' '+d.getDate()+', '+d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}
function monthKeysSorted(){ return Object.keys(S.months).sort(); }
function catById(id){ for(var i=0;i<S.cats.length;i++) if(S.cats[i].id===id) return S.cats[i]; return null; }
function fundById(id){ var f=(S.funding||[]).filter(function(x){ return x.id===id; }); return f[0]||null; }
function fundName(id){ var f = fundById(id); return f ? f.name : ''; }
function plural(n, one, many){ return n + ' ' + (n===1 ? one : (many || one+'s')); }

function rowStatus(row, key){
  if(row.paidOn) return 'paid';
  var due = row.dueDay ? dueISO(key, row.dueDay) : (key + '-' + String(daysIn(key)).padStart(2,'0'));
  return (due < todayISO()) ? 'overdue' : 'pending';
}
function statusLabel(s){ return s==='paid' ? 'Paid' : (s==='overdue' ? 'Overdue' : 'Pending'); }

function monthTotals(key){
  var m = S.months[key];
  var out = {exp:0, paid:0, unpaid:0, overdue:0, inc:0, missing:0, rows:0};
  if(!m) return out;
  m.rows.forEach(function(r){
    var a = Number(r.amount)||0;
    out.rows++;
    if(r.amount===null || r.amount==='') out.missing++;
    out.exp += a;
    var st = rowStatus(r, key);
    if(st==='paid') out.paid += a;
    else { out.unpaid += a; if(st==='overdue') out.overdue += a; }
  });
  (m.income||[]).forEach(function(i){ out.inc += Number(i.amount)||0; });
  out.net = out.inc - out.exp;
  return out;
}
function groupTotals(key){
  var m = S.months[key], map = {};
  if(!m) return [];
  m.rows.forEach(function(r){ var g = r.group || 'Other'; map[g] = (map[g]||0) + (Number(r.amount)||0); });
  return Object.keys(map).map(function(g){ return {name:g, value:map[g]}; }).sort(function(a,b){ return b.value - a.value; });
}

// Mirrors the server's upgrade so an older local draft still has the autopay fields.
function upgrade(d){
  d.funding = (d.funding && d.funding.length) ? d.funding : [
    {id:'gcash',name:'GCash',balance:null,asOf:null},{id:'bpi',name:'BPI',balance:null,asOf:null},
    {id:'unionbank',name:'UnionBank',balance:null,asOf:null},{id:'bdo',name:'BDO',balance:null,asOf:null},
    {id:'eastwest',name:'EastWest',balance:null,asOf:null}];
  d.automation = Object.assign({leadDays:3, autoCreateMonth:true, notifyOnPayment:true, digestHour:8}, d.automation||{});
  d.cats.forEach(function(c){
    if(['auto-debit','scheduled','manual'].indexOf(c.payMode) < 0) c.payMode = 'manual';
    if(typeof c.enrolled !== 'boolean') c.enrolled = false;
    if(c.fundFrom === undefined) c.fundFrom = '';
    if(c.accountNo === undefined) c.accountNo = '';
    if(c.matchKeys === undefined) c.matchKeys = '';
  });
  return d;
}

/* ============================ persistence ============================ */
var VERSION = 0, SAVING = false, SAVE_T = null, SAVE_ERR = '';

function api(path, opts){
  opts = opts || {};
  opts.credentials = 'same-origin';
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
  return fetch(path, opts).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(r.status === 401){ throw (j && j.code) ? j : {code:'unauthorized'}; }
      if(!r.ok){ j = j || {}; j.status = r.status; throw j; }
      return j;
    });
  });
}
function post(path, body){ return api(path, {method:'POST', body: JSON.stringify(body||{})}); }
function loadState(){
  return api('/api/state').then(function(j){
    S = upgrade(j.data); VERSION = j.version; DIRTY = false; SAVE_ERR = '';
    var draft = null;
    try{ var raw = localStorage.getItem(DRAFT_KEY); if(raw) draft = JSON.parse(raw); }catch(e){ draft = null; }
    if(draft && draft.state && draft.state.meta && draft.version === VERSION){
      var du = draft.state.meta.updatedAt || '', su = (S.meta && S.meta.updatedAt) || '';
      if(du > su){ S = upgrade(draft.state); DIRTY = true; queueSave(); }
    }
  });
}
var AUTO_T = null;
function loadAuto(){
  return api('/api/automation').then(function(j){ AUTO = j; AUTO_ERR = ''; })
    .catch(function(e){ if(e && e.code==='unauthorized'){ AUTHED=false; } AUTO_ERR = 'Could not load the autopay status.'; });
}
function refreshAuto(delay){
  clearTimeout(AUTO_T);
  AUTO_T = setTimeout(function(){ loadAuto().then(function(){ if(AUTHED) paintAutoParts(); }); }, delay || 0);
}
function saveDraft(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({version:VERSION, state:S})); }catch(e){} }
function touch(){
  S.meta.updatedAt = new Date().toISOString();
  DIRTY = true; saveDraft(); queueSave(); paintChip();
}
function queueSave(delay){ clearTimeout(SAVE_T); SAVE_T = setTimeout(saveNow, delay || 900); }
function saveNow(){
  if(!DIRTY || SAVING || !AUTHED) return;
  SAVING = true; SAVE_ERR = ''; paintChip();
  var sending = JSON.stringify(S);
  api('/api/state', {method:'PUT', body:'{"version":' + VERSION + ',"data":' + sending + '}'})
  .then(function(j){
    SAVING = false; VERSION = j.version;
    if(JSON.stringify(S) === sending){
      DIRTY = false;
      try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    }else{ queueSave(400); }
    paintChip();
    refreshAuto(300);
  })
  .catch(function(err){
    SAVING = false;
    var code = err && err.code;
    if(code === 'unauthorized'){ AUTHED = false; render(); return; }
    if(code === 'conflict'){
      SAVE_ERR = '';
      toast('A receipt or another window changed the ledger — loaded the latest version.');
      loadState().then(function(){ render(); refreshAuto(); }).catch(function(){});
      return;
    }
    SAVE_ERR = 'error'; paintChip();
    queueSave(6000);
  });
}
// Pick up payments recorded by the receipt inbox without a manual refresh.
function poll(){
  if(!AUTHED || DIRTY || SAVING || document.hidden) return;
  api('/api/state/version').then(function(j){
    if(j.version > VERSION && !DIRTY && !SAVING){
      loadState().then(function(){ if(!$('#modal-host')) render(); refreshAuto(); });
    }
  }).catch(function(){});
}
function paintChip(){
  var c = document.querySelector('.savechip');
  if(c) c.outerHTML = saveChip();
  var b = document.querySelector('[data-act="save"]');
  if(b) b.disabled = !DIRTY || SAVING;
}
function toast(msg){
  var old = $('.toast'); if(old) old.remove();
  var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(TOAST_T);
  TOAST_T = setTimeout(function(){ if(t.parentNode) t.remove(); }, 4200);
}
function copyText(text, what){
  var done = function(){ toast((what||'Text') + ' copied.'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text); done(); });
  }else{ fallbackCopy(text); done(); }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove();
}

/* ============================ auth ============================ */
function login(username, password){ return post('/api/login', {username:username, password:password}); }
function logout(){ return post('/api/logout').catch(function(){ return null; }); }

/* ============================ month scaffolding ============================ */
function ensureMonth(key){
  if(!S.months[key]) S.months[key] = {income:[], rows:[], note:''};
  return S.months[key];
}
function rowFromCat(c){
  return {
    id: uid(), catId: c.id, name: c.name, detail: c.detail||'', group: c.group,
    kind: c.kind, amount: (c.kind === 'fixed' ? (c.amount==null?null:c.amount) : null),
    dueDay: c.dueDay || null, paidOn: '', method: c.method || '', note: ''
  };
}
function seedMonth(key){
  var m = ensureMonth(key), have = {}, added = 0;
  m.rows.forEach(function(r){ if(r.catId) have[r.catId] = true; });
  S.cats.forEach(function(c){ if(!c.active || have[c.id]) return; m.rows.push(rowFromCat(c)); added++; });
  touch();
  return added;
}
function copyPrevAmounts(key){
  var keys = monthKeysSorted().filter(function(k){ return k < key; });
  if(!keys.length) return 0;
  var prev = S.months[keys[keys.length-1]], m = S.months[key], n = 0;
  m.rows.forEach(function(r){
    if(r.amount!=null && r.amount!=='') return;
    for(var i=0;i<prev.rows.length;i++){
      if(prev.rows[i].catId && prev.rows[i].catId === r.catId && prev.rows[i].amount!=null){ r.amount = prev.rows[i].amount; n++; break; }
    }
  });
  if(n) touch();
  return n;
}

/* ============================ chart utilities ============================ */
function niceTop(max){
  if(max <= 0) return 10;
  var mag = Math.pow(10, Math.floor(Math.log10(max)));
  var steps = [1,1.5,2,2.5,3,4,5,6,8,10];
  for(var i=0;i<steps.length;i++){ if(max <= steps[i]*mag) return steps[i]*mag; }
  return 10*mag;
}
function topRoundPath(x,y,w,h,r){
  if(h <= 0.5) return '';
  var rr = Math.min(r, w/2, h);
  return 'M'+x+','+(y+h)+'V'+(y+rr)+'a'+rr+','+rr+' 0 0 1 '+rr+',-'+rr+'h'+(w-2*rr)+'a'+rr+','+rr+' 0 0 1 '+rr+','+rr+'V'+(y+h)+'Z';
}
function rightRoundPath(x,y,w,h,r){
  if(w <= 0.5) return '';
  var rr = Math.min(r, h/2, w);
  return 'M'+x+','+y+'h'+(w-rr)+'a'+rr+','+rr+' 0 0 1 '+rr+','+rr+'v'+(h-2*rr)+'a'+rr+','+rr+' 0 0 1 -'+rr+','+rr+'H'+x+'Z';
}
function tipHTML(title, rows){
  var h = '<div class="t">'+esc(title)+'</div>';
  rows.forEach(function(r){
    h += '<div class="row"><span class="k">'+(r.color?'<span class="sw" style="background:'+r.color+'"></span>':'')+esc(r.k)+'</span><span class="num" style="font-weight:700">'+esc(r.v)+'</span></div>';
  });
  return h;
}
function drawTrend(host){
  var year = Number((MK||todayKey()).split('-')[0]);
  var data = [];
  for(var i=1;i<=12;i++){
    var k = year+'-'+String(i).padStart(2,'0');
    var t = S.months[k] ? monthTotals(k) : null;
    data.push({k:k, lab:MNS[i-1], exp:t?t.exp:0, inc:t?t.inc:0, has:!!t});
  }
  var anyInc = data.some(function(d){ return d.inc>0; });
  var W = Math.max(320, host.clientWidth), H = 250;
  var pad = {t:14, r:14, b:30, l:58};
  var iw = W-pad.l-pad.r, ih = H-pad.t-pad.b;
  var max = 0; data.forEach(function(d){ max = Math.max(max, d.exp, d.inc); });
  var top = niceTop(max);
  var y = function(v){ return pad.t + ih - (v/top)*ih; };
  var band = iw/12, bw = Math.min(26, band*0.55);
  var s = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Expenses and income by month">';
  for(var g=0; g<=4; g++){
    var gv = top*g/4, gy = y(gv);
    s += '<line x1="'+pad.l+'" y1="'+gy+'" x2="'+(W-pad.r)+'" y2="'+gy+'" stroke="var(--grid)" stroke-width="1"/>';
    s += '<text x="'+(pad.l-10)+'" y="'+(gy+4)+'" text-anchor="end" font-size="10.5" class="num" fill="var(--muted)">'+(gv?moneyShort(gv):'0')+'</text>';
  }
  data.forEach(function(d,i){
    var cx = pad.l + band*i + band/2;
    var by = y(d.exp), bh = pad.t+ih-by;
    if(d.exp>0) s += '<path d="'+topRoundPath(cx-bw/2, by, bw, bh, 5)+'" fill="var(--s1)" opacity="'+(d.k===MK?1:.82)+'"/>';
    if(W >= 500 || i % 2 === 0 || d.k === MK){
      s += '<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="'+(d.k===MK?'var(--ink)':'var(--muted)')+'" font-weight="'+(d.k===MK?'700':'500')+'">'+d.lab+'</text>';
    }
  });
  if(anyInc){
    var seg = [];
    var flush = function(){ if(seg.length>1) s += '<polyline points="'+seg.join(' ')+'" fill="none" stroke="var(--s2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'; seg = []; };
    data.forEach(function(d,i){ if(d.has) seg.push((pad.l+band*i+band/2)+','+y(d.inc)); else flush(); });
    flush();
    data.forEach(function(d,i){
      if(!d.has) return;
      s += '<circle cx="'+(pad.l+band*i+band/2)+'" cy="'+y(d.inc)+'" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>';
    });
  }
  s += '<line x1="'+pad.l+'" y1="'+(pad.t+ih)+'" x2="'+(W-pad.r)+'" y2="'+(pad.t+ih)+'" stroke="var(--axis)" stroke-width="1"/>';
  s += '<g class="hot">';
  data.forEach(function(d,i){ s += '<rect x="'+(pad.l+band*i)+'" y="'+pad.t+'" width="'+band+'" height="'+ih+'" fill="transparent" data-i="'+i+'"/>'; });
  s += '</g></svg>';
  host.innerHTML = s + '<div class="tip"></div>';
  var tip = $('.tip', host);
  $$('.hot rect', host).forEach(function(rc){
    rc.addEventListener('mouseenter', function(){
      var d = data[Number(rc.getAttribute('data-i'))];
      var rows = [{k:'Expenses', v:money(d.exp), color:'var(--s1)'}];
      if(anyInc) rows.push({k:'Income', v:money(d.inc), color:'var(--s2)'});
      if(!d.has) rows = [{k:'', v:'No entries yet'}];
      tip.innerHTML = tipHTML(MN[Number(d.k.split('-')[1])-1]+' '+year, rows);
      tip.style.opacity = '1';
      tip.style.left = (pad.l + band*Number(rc.getAttribute('data-i')) + band/2) + 'px';
      tip.style.top = (pad.t + 6) + 'px';
    });
    rc.addEventListener('mouseleave', function(){ tip.style.opacity='0'; });

function drawCats(host, rows){
  rows = rows.filter(function(r){ return r.value > 0; });
  if(!rows.length){ host.innerHTML = '<p class="hint" style="padding:8px 0">Nothing recorded for this period yet.</p>'; return; }
  var W = Math.max(300, host.clientWidth);
  var labW = Math.max(96, Math.min(170, Math.round(W*0.26)));
  var valW = 100, rowH = 32, barH = 14;
  var iw = W - labW - valW - 10;
  var max = 0; rows.forEach(function(r){ max = Math.max(max, r.value); }); max = max || 1;
  var H = rows.length*rowH + 4;
  var s = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Expenses by category">';
  rows.forEach(function(r,i){
    var cy = i*rowH + rowH/2, w = Math.max(0, (r.value/max)*iw);
    s += '<text x="0" y="'+(cy+4)+'" font-size="12" fill="var(--ink-2)" font-weight="600">'+esc(r.name)+'</text>';
    s += '<rect x="'+labW+'" y="'+(cy-barH/2)+'" width="'+iw+'" height="'+barH+'" rx="4" fill="var(--surface-3)"/>';
    s += '<path d="'+rightRoundPath(labW, cy-barH/2, w, barH, 4)+'" fill="'+(i===0?'var(--s2)':'var(--s1)')+'"/>';
    s += '<text x="'+(labW+iw+10)+'" y="'+(cy+4)+'" font-size="12" class="num" fill="var(--ink)" font-weight="700">'+esc(money(r.value))+'</text>';
    s += '<rect x="0" y="'+(i*rowH)+'" width="'+W+'" height="'+rowH+'" fill="transparent" data-i="'+i+'"/>';
  });
  s += '</svg>';
  host.innerHTML = s + '<div class="tip"></div>';
  var tip = $('.tip', host), total = rows.reduce(function(a,b){ return a+b.value; },0) || 1;
  $$('rect[data-i]', host).forEach(function(rc){
    rc.addEventListener('mouseenter', function(){
      var r = rows[Number(rc.getAttribute('data-i'))];
      tip.innerHTML = tipHTML(r.name, [{k:'Amount', v:money(r.value)}, {k:'Share', v:(r.value/total*100).toFixed(1)+'%'}]);
      tip.style.opacity='1';
      tip.style.left = Math.min(W-90, labW + 40) + 'px';
      tip.style.top  = (Number(rc.getAttribute('data-i'))*rowH) + 'px';
    });
    rc.addEventListener('mouseleave', function(){ tip.style.opacity='0'; });
  });
}
function paintCharts(){
  $$('[data-chart]').forEach(function(host){
    var kind = host.getAttribute('data-chart');
    if(kind === 'trend') drawTrend(host);
    if(kind === 'cats') drawCats(host, groupTotals(MK));
    if(kind === 'catsyear') drawCats(host, yearGroupTotals());
  });
}

window.addEventListener('resize', function(){ clearTimeout(RSZ); RSZ = setTimeout(paintCharts, 160); });
function yearGroupTotals(){
  var year = (MK||todayKey()).split('-')[0], map = {};
  monthKeysSorted().forEach(function(k){
    if(k.indexOf(year+'-') !== 0) return;
    S.months[k].rows.forEach(function(r){ var g = r.group||'Other'; map[g] = (map[g]||0) + (Number(r.amount)||0); });
  });
  return Object.keys(map).map(function(g){ return {name:g, value:map[g]}; }).sort(function(a,b){ return b.value-a.value; });
}

function scheduleList(items, limit, emptyMsg){
  if(!AUTO) return '<div class="skel" style="width:70%"></div><div class="skel" style="width:85%"></div><div class="skel" style="width:60%"></div>';
  if(!items.length) return '<p class="hint" style="margin:4px 0">'+esc(emptyMsg||'Nothing due.')+'</p>';
  var byDay = {}, order = [];
  items.slice(0, limit||999).forEach(function(i){ if(!byDay[i.due]){ byDay[i.due]=[]; order.push(i.due); } byDay[i.due].push(i); });
  var today = AUTO.overview.today;
  return '<div class="sched">' + order.map(function(d){
    var p = d.split('-'), dt = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
    var cls = d === today ? 'today' : (d < today ? 'late' : '');
    return '<div class="day"><div class="when '+cls+'"><div class="m">'+(d===today?'Today':MNS[dt.getMonth()])+'</div><div class="d">'+dt.getDate()+'</div></div><div class="items">'
      + byDay[d].map(function(i){
          var f = fundName(i.fundFrom);
          var sub = [];
          if(d < today) sub.push('<span style="color:var(--crit-ink); font-weight:600">'+plural(-i.daysLeft,'day')+' late</span>');
          else if(d !== today) sub.push(DOW[dt.getDay()] + (i.daysLeft<=7 ? ' · in '+plural(i.daysLeft,'day') : ''));
          if(f) sub.push('from '+esc(f));
          if(!i.hasDueDay) sub.push('no due day set');
          if(i.projected) sub.push(esc(mLabel(i.monthKey))+' bill');
          return '<div class="it"><div class="nm">'+esc(i.name)+'<small>'+sub.join(' · ')+'</small></div>'
            + modeChip(i.payMode, i.enrolled)
            + '<span class="amt">'+(i.amount==null?'<span class="hint">amount?</span>':esc(money(i.amount)))+'</span></div>';
        }).join('') + '</div></div>';
  }).join('') + '</div>';
}

  h += '<div class="grid cols2e">'
    + '<div class="card"><div class="ch"><h3>Bills and income by month</h3><span class="sub">'+esc(MK.split('-')[0])+'</span></div><div class="cb">'
    +   '<div class="legend"><span class="lg"><span class="sw" style="background:var(--s1)"></span>Expenses</span><span class="lg"><span class="swl" style="background:var(--s2)"></span>Income</span></div>'
    +   '<div class="chartwrap" data-chart="trend"></div>' + yearTable()
    + '</div></div>'
    + '<div class="card"><div class="ch"><h3>Where the money goes</h3><span class="sub">'+esc(mLabel(MK))+'</span></div><div class="cb"><div class="chartwrap" data-chart="cats"></div></div></div>'
    + '</div>';
  return h;
}
function statusBlock(t){
  var total = t.exp || 1;
  var paidW = t.paid/total*100, odW = t.overdue/total*100, pdW = Math.max(0,(t.unpaid-t.overdue))/total*100;
  return '<div class="statusbar">'
    + (paidW>0?'<span style="background:var(--good); flex:0 0 '+paidW+'%"></span>':'')
    + (pdW>0?'<span style="background:var(--warn); flex:0 0 '+pdW+'%"></span>':'')
    + (odW>0?'<span style="background:var(--crit); flex:0 0 '+odW+'%"></span>':'')
    + (t.exp===0?'<span style="background:var(--surface-3); flex:1"></span>':'')
    + '</div>'
    + '<table class="mini"><tbody>'
    + '<tr><td><span class="pill paid"><span class="dot"></span>Paid</span></td><td class="r num" style="font-weight:700">'+esc(money(t.paid))+'</td></tr>'
    + '<tr><td><span class="pill pending"><span class="dot"></span>Pending</span></td><td class="r num" style="font-weight:700">'+esc(money(Math.max(0,t.unpaid-t.overdue)))+'</td></tr>'
    + '<tr><td><span class="pill overdue"><span class="dot"></span>Overdue</span></td><td class="r num" style="font-weight:700">'+esc(money(t.overdue))+'</td></tr>'
    + '</tbody></table>';
}
function yearTable(){
  var year = (MK||todayKey()).split('-')[0], rows = '';
  for(var i=1;i<=12;i++){
    var k = year+'-'+String(i).padStart(2,'0');
    if(!S.months[k]) continue;
    var t = monthTotals(k);
    rows += '<tr><td>'+esc(mLabel(k))+'</td><td class="r num">'+esc(money(t.exp))+'</td><td class="r num">'+esc(money(t.inc))+'</td></tr>';
  }
  if(!rows) return '';
  return '<details class="tbl"><summary>Show the numbers behind this chart</summary>'
    + '<table class="mini" style="margin-top:8px"><thead><tr><th>Month</th><th class="r">Expenses</th><th class="r">Income</th></tr></thead><tbody>' + rows + '</tbody></table></details>';
}

/* ============================ autopay center ============================ */
function viewAutopay(){
  var h = '<header><div class="eyebrow">Automation</div><h1>Autopay center</h1>'
    + '<p>Your bank auto-debits and GCash schedules move the money. This page makes sure it happens: what is due, what each account must hold, and every receipt that came in.</p></header>';

    return h + (AUTO_ERR ? '<div class="banner crit">'+ic('alert')+'<div class="txt">'+esc(AUTO_ERR)+'</div><button class="btn sm" data-act="reloadauto">Try again</button></div>'
      : '<div class="card"><div class="cb"><div class="skel"></div><div class="skel" style="width:80%"></div><div class="skel" style="width:60%"></div></div></div>');
  }
  var ov = AUTO.overview, ch = AUTO.channels;

    + '<div class="stat '+(inboxOn?'ok':'no')+'">'+ic(inboxOn?'ok':'mail')+'<div><b>Receipt inbox</b><span>'

    + '<div class="stat '+(chans.length?'ok':'no')+'">'+ic(chans.length?'ok':'bell')+'<div><b>Reminders</b><span>'
    +   (chans.length ? 'Daily digest at '+fmtHour(S.automation.digestHour)+' via '+esc(chans.join(', ')) : 'Not set up yet — reminders only show here.')+'</span>'
    +   (chans.length ? '' : '<br><button class="btn sm" data-act="gosettings">Set up phone alerts</button>') + '</div></div>'
    + '<div class="stat ok">'+ic('clock')+'<div><b>Automatic checks</b><span>Every 10 minutes'+(AUTO.lastRun?' · last '+esc(fmtWhen(AUTO.lastRun)):'')+'. New months are built on the 1st.</span></div></div>'
    + '</div>';

  var review = AUTO.events.filter(function(e){ return e.status==='needs_review'; });

      + review.map(function(e){

          var opts = '<option value="">Choose the bill this pays…</option>'
            + (e.candidates||[]).map(function(c){ return '<option value="'+esc(c.catId)+'">'+esc(c.name)+' (likely)</option>'; }).join('')
            + S.cats.filter(function(c){ return c.active && cands.indexOf(c.id) < 0; }).map(function(c){ return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'; }).join('');
          return '<div class="review"><div style="display:flex; gap:10px; flex-wrap:wrap; align-items:baseline">'
            + '<b>'+esc(e.subject || 'Pasted receipt')+'</b><span class="hint">'+esc(e.sender||'')+' · '+esc(fmtWhen(e.received_at))+'</span></div>'
            + '<div class="ex">'+esc(e.excerpt||'')+'</div>'
            + '<div class="acts"><span class="pill pending">'+(e.amount==null?'No amount found':esc(money(e.amount)))+'</span>'
            + (e.paid_on?'<span class="tag">'+esc(fmtDate(e.paid_on))+'</span>':'') + (e.ref?'<span class="tag">Ref '+esc(e.ref)+'</span>':'')
            + '<select data-rev="'+e.id+'" aria-label="Bill for this receipt">'+opts+'</select>'
            + '<button class="btn pri sm" data-act="assign" data-id="'+e.id+'">Record payment</button>'
            + '<button class="btn ghost sm" data-act="dismiss" data-id="'+e.id+'">Not a bill</button></div></div>';
        }).join('')
      + '</div></div>';
  }

  h += '<div class="grid cols2 mb">'
    + '<div class="card"><div class="ch"><h3>Payment calendar</h3><span class="sub">Overdue and next 30 days</span></div><div class="cb">'
    +   (ov.overdue.length ? '<div class="eyebrow" style="color:var(--crit-ink); margin-bottom:4px">Past due — no payment recorded</div>' + scheduleList(ov.overdue) + '<div style="height:14px"></div><div class="eyebrow" style="margin-bottom:4px">Upcoming</div>' : '')
    +   scheduleList(ov.upcoming, 40, 'Nothing due in the next 30 days.')
    + '</div></div>'
    + '<div style="display:flex; flex-direction:column; gap:18px">'

function fmtHour(hh){ hh = Number(hh); return (hh%12||12) + (hh<12?' AM':' PM'); }
function fundingCard(ov){
  var rows = ov.funding.filter(function(f){ return f.count || f.balance != null; });
  var all = ov.funding;
  return '<div class="card"><div class="ch"><h3>Funding plan</h3><span class="sub">What each account must hold</span></div><div class="cb">'
    + '<p class="hint" style="margin:0 0 12px">Add a balance when you check your app and the plan tells you what to top up before the debits run.</p>'
    + '<div class="tw"><table class="mini"><thead><tr><th>Account</th><th class="r">Next 7 days</th><th class="r">Next 30 days</th><th class="r">Balance</th><th class="r">Status</th></tr></thead><tbody>'
    + (rows.length ? rows : all.slice(0,3)).map(function(f){
        var st;
        if(f.balance == null) st = '<span class="hint">add balance</span>';
        else if(f.short7 > 0) st = '<span class="pill overdue">Short '+esc(money(f.short7))+'</span>';
        else if(f.short30 > 0) st = '<span class="pill pending">Short '+esc(money(f.short30))+' by month</span>';
        else st = '<span class="pill paid">Covered</span>';
        return '<tr><td style="font-weight:700">'+esc(f.name)+'<span class="subline">'+plural(f.count,'bill')+(f.asOf?' · bal. '+esc(fmtDate(f.asOf)):'')+'</span></td>'
          + '<td class="r num">'+esc(money(f.need7))+'</td><td class="r num">'+esc(money(f.need30))+'</td>'
          + '<td class="r"><input type="number" step="0.01" min="0" inputmode="decimal" class="num" style="width:110px; text-align:right; padding:5px 8px" placeholder="—" value="'+(f.balance==null?'':f.balance)+'" data-f="fundbal" data-id="'+esc(f.id)+'" aria-label="'+esc(f.name)+' balance"></td>'
          + '<td class="r">'+st+'</td></tr>';
      }).join('')
    + '</tbody></table></div>'
    + '<p class="hint" style="margin:10px 0 0">Bills are assigned to an account on the <a href="#" data-act="nav" data-view="bills">Bills</a> page (“Funded from”).</p>'
    + '</div></div>';
}
function pasteCard(){
  var body;
  if(!RECEIPT){
    body = '<p class="hint" style="margin:0 0 10px">Paid something by hand? Paste the GCash or bank SMS/email here and it will be filed against the right bill.</p>'
      + '<textarea id="rcpt" rows="4" placeholder="e.g. You have paid PHP 4,763.00 to PLDT. Ref No. 1234567890123"></textarea>'
      + '<div style="display:flex; gap:8px; margin-top:10px"><button class="btn pri sm" data-act="parsercpt">Read receipt</button></div>';
  }else{
    var p = RECEIPT.parsed, best = RECEIPT.match.best, cands = RECEIPT.match.candidates.map(function(c){ return c.catId; });
    var opts = '<option value="">Choose a bill…</option>'
      + RECEIPT.match.candidates.map(function(c){ return '<option value="'+esc(c.catId)+'"'+(c.catId===best?' selected':'')+'>'+esc(c.name)+'</option>'; }).join('')
      + S.cats.filter(function(c){ return c.active && cands.indexOf(c.id)<0; }).map(function(c){ return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'; }).join('');
    body = (best ? '<div class="banner good" style="margin-bottom:12px; padding:9px 12px">'+ic('check')+'<div class="txt">Looks like <b>'+esc((catById(best)||{}).name||'')+'</b>. Check the details and record it.</div></div>'
                 : '<div class="banner warn" style="margin-bottom:12px; padding:9px 12px">'+ic('alert')+'<div class="txt">Could not tell which bill this is — choose it below.</div></div>')
      + '<div style="display:flex; flex-direction:column; gap:10px">'
      + '<label class="fld"><span>Bill</span><select id="rc-cat">'+opts+'</select></label>'
      + '<div class="two"><label class="fld"><span>Amount paid</span><input id="rc-amt" type="number" step="0.01" class="num" value="'+(p.amount==null?'':p.amount)+'"></label>'
      + '<label class="fld"><span>Date paid</span><input id="rc-date" type="date" value="'+esc(p.date)+'"></label></div>'
      + '<label class="fld"><span>Reference no. <span class="hint">optional</span></span><input id="rc-ref" type="text" value="'+esc(p.ref||'')+'"></label>'
      + '<div style="display:flex; gap:8px"><button class="btn pri sm" data-act="applyrcpt">Record payment</button><button class="btn ghost sm" data-act="clearrcpt">Cancel</button></div></div>';

        + ev.map(function(e){

        + '<td><select data-f="method" data-id="'+r.id+'" aria-label="Payment method for '+esc(r.name)+'" style="width:136px"><option value="">—</option>'

          + (st==='paid'?'':'<button class="iconbtn go" data-act="markpaid" data-id="'+r.id+'" title="Mark paid today">Paid</button>')

    + '<tbody>'+body+'</tbody></table></div></div>';

  var inc = m.income||[];

            return '<tr><td><input type="text" value="'+esc(i.label)+'" data-f="inclabel" data-id="'+i.id+'" aria-label="Income source"></td>'

      : '<p class="hint" style="margin:0 0 12px">No income recorded yet for this month.</p>')
    + '<button class="btn sm noprint" data-act="addinc" style="margin-top:12px">'+ic('plus')+'Add income line</button>'

function methodOptions(sel){
  var list = S.methods.slice();

}

/* ============================ modal ============================ */
function closeModal(){ var m = $('#modal-host'); if(m) m.remove(); }
function openModal(title, bodyHTML, onSave, saveLabel, wide){
  closeModal();
  var host = document.createElement('div');
  host.id = 'modal-host';
  host.innerHTML = '<div class="modal"><div class="box'+(wide?' wide':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(title)+'">'
    + '<div class="mh"><h3>'+esc(title)+'</h3><button class="iconbtn" data-mact="close" aria-label="Close">Close</button></div>'
    + '<form class="mb" id="modal-form">'+bodyHTML+'</form>'
    + '<div class="mf"><button class="btn" data-mact="close" type="button">Cancel</button>'
    + '<button class="btn pri" data-mact="ok" type="button">'+esc(saveLabel||'Save')+'</button></div>'
    + '</div></div>';
  document.body.appendChild(host);
  host.addEventListener('click', function(e){
    var b = e.target.closest('[data-mact]');
    if(!b) { if(e.target.classList.contains('modal')) closeModal(); return; }
    if(b.getAttribute('data-mact') === 'close'){ closeModal(); return; }
    if(onSave(host) !== false) closeModal();
  });
  host.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeModal();
    if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON'){ e.preventDefault(); if(onSave(host)!==false) closeModal(); }
  });
  host.addEventListener('change', function(e){
    if(e.target.name === 'payMode'){
      var en = host.querySelector('[data-enrolled]');
      if(en) en.style.display = e.target.value === 'manual' ? 'none' : '';
    }
  });
  var f = host.querySelector('input,select,textarea'); if(f) f.focus();
}

function readCat(h, c){
  var a = mval(h,'amount'), d = mval(h,'dueDay');
  c.name = mval(h,'name'); c.detail = mval(h,'detail'); c.group = mval(h,'group'); c.kind = mval(h,'kind');
  c.amount = a === '' ? null : Number(a); c.dueDay = d === '' ? null : Math.max(1, Math.min(31, Number(d)));
  c.method = mval(h,'method'); c.payMode = mval(h,'payMode') || 'manual'; c.enrolled = c.payMode !== 'manual' && !!mval(h,'enrolled');
  c.fundFrom = mval(h,'fundFrom'); c.accountNo = String(mval(h,'accountNo')).replace(/[\s-]/g,''); c.matchKeys = mval(h,'matchKeys');
  return c;
}

/* ============================ export ============================ */
function csvCell(v){ var s = String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function buildCSV(scope){
  var keys = scope==='month' ? [MK] : monthKeysSorted();
  var out = [['Month','Expense','Reference','Category','Type','Amount','Due date','Date paid','Method','Receipt ref','Status','Note'].join(',')];
  keys.forEach(function(k){
    var m = S.months[k]; if(!m) return;
    m.rows.forEach(function(r){
      out.push([mLabel(k), r.name, r.detail||'', r.group, r.kind==='fixed'?'Fixed':'Varies',
        (r.amount==null?'':r.amount), (r.dueDay?dueISO(k,r.dueDay):''), r.paidOn||'', r.method||'', r.ref||'',
        statusLabel(rowStatus(r,k)), r.note||''].map(csvCell).join(','));
    });
    (m.income||[]).forEach(function(i){
      out.push([mLabel(k),'INCOME: '+(i.label||'Unlabelled'),'','Income','', (i.amount==null?'':i.amount),'','','','','',''].map(csvCell).join(','));
    });
  });
  return out.join('\n');
}
function offerDownload(filename, text){
  try{
    var blob = new Blob([text], {type: filename.slice(-4) === 'json' ? 'application/json' : 'text/csv;charset=utf-8'});
    var href = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = href; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(href); a.remove(); }, 1000);
  }catch(e){ showCopyBox(filename, text); }
}
function showCopyBox(filename, text){
  openModal('Copy '+filename,
    '<p class="hint" style="margin:0">Your browser blocked the download. Select everything below and copy it into a new file called <b>'+esc(filename)+'</b>.</p>'
    + '<textarea rows="12" style="font-family:ui-monospace,monospace; font-size:12px" readonly>'+esc(text)+'</textarea>',
    function(){ return true; }, 'Done');
}

/* ============================ events ============================ */
function errMsg(e, fallback){ return (e && e.message) ? e.message : fallback; }

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]');
  if(!b || b.closest('#modal-host')) return;
  var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  if(b.tagName === 'A') e.preventDefault();

  if(act === 'nav'){
    VIEW = b.getAttribute('data-view'); window.scrollTo(0,0); render();
    if(VIEW === 'autopay' || VIEW === 'dashboard') refreshAuto();
    if(VIEW === 'settings') loadSettings();
    return;
  }
  if(act === 'gosettings'){ VIEW = 'settings'; window.scrollTo(0,0); render(); loadSettings(); return; }
  if(act === 'lock'){ if(DIRTY) saveNow(); logout().then(function(){ AUTHED = false; AUTO = null; SETTINGS = null; renderGate(); }); return; }
  if(act === 'save'){ saveNow(); return; }
  if(act === 'reloadauto'){ AUTO_ERR=''; render(); refreshAuto(); return; }

  if(act === 'newmonth'){
    var last = monthKeysSorted().pop() || todayKey();
    var p = last.split('-'), yy = Number(p[0]), mm = Number(p[1]) + 1;
    if(mm > 12){ mm = 1; yy++; }
    var nk = yy+'-'+String(mm).padStart(2,'0');
    ensureMonth(nk); MK = nk; VIEW = 'month';
    if(!S.months[nk].rows.length) seedMonth(nk);
    touch(); render(); toast(mLabel(nk)+' created from your bill list.');
    return;
  }
  if(act === 'seed'){ var n = seedMonth(MK); VIEW = 'month'; render(); toast(n ? (plural(n,'bill')+' added to '+mLabel(MK)) : 'Everything on your list is already in this month.'); return; }
  if(act === 'copyprev'){ var c = copyPrevAmounts(MK); render(); toast(c ? (plural(c,'amount')+' copied forward.') : 'No earlier month to copy from.'); return; }

  if(act === 'markpaid'){
    S.months[MK].rows.forEach(function(r){ if(r.id===id){ r.paidOn = todayISO(); if(!r.method) r.method = (catById(r.catId)||{}).method || ''; } });
    touch(); render(); return;
  }
  if(act === 'delrow'){ var mm2 = S.months[MK]; mm2.rows = mm2.rows.filter(function(r){ return r.id !== id; }); touch(); render(); return; }
  if(act === 'editrow'){
    var row = null; S.months[MK].rows.forEach(function(r){ if(r.id===id) row = r; });
    if(!row) return;
    openModal('Edit line — '+row.name,
      fieldsFor(row, false) + '<label class="fld"><span>Note for this month</span><input type="text" name="note" value="'+esc(row.note||'')+'"></label>',
      function(h){
        var nm = mval(h,'name'); if(!nm) return false;
        row.name = nm; row.detail = mval(h,'detail'); row.group = mval(h,'group'); row.kind = mval(h,'kind');
        var a = mval(h,'amount'); row.amount = a === '' ? null : Number(a);
        var d = mval(h,'dueDay'); row.dueDay = d === '' ? null : Number(d);
        row.method = mval(h,'method'); row.note = mval(h,'note');
        touch(); render();
      });
    return;
  }
  if(act === 'addrow'){
    openModal('Add an expense to '+mLabel(MK),
      fieldsFor({kind:'variable', group:'Other'}, false)
      + '<label class="check"><input type="checkbox" name="recur"><span>Also add this to my recurring bill list</span></label>',
      function(h){
        var nm = mval(h,'name'); if(!nm) return false;
        var a = mval(h,'amount'), d = mval(h,'dueDay');
        var row = {id:uid(), catId:null, name:nm, detail:mval(h,'detail'), group:mval(h,'group'), kind:mval(h,'kind'),
          amount:(a===''?null:Number(a)), dueDay:(d===''?null:Number(d)), paidOn:'', method:mval(h,'method'), note:''};
        if(mval(h,'recur')){
          var cc = {id:uid(), name:row.name, detail:row.detail, group:row.group, kind:row.kind, amount:row.amount, dueDay:row.dueDay,
            method:row.method, active:true, note:'', payMode:'manual', enrolled:false, fundFrom:'', accountNo:'', matchKeys:''};
          S.cats.push(cc); row.catId = cc.id;
        }
        ensureMonth(MK).rows.push(row); touch(); render();
      }, 'Add expense');
    return;
  }
  if(act === 'addinc'){ ensureMonth(MK).income.push({id:uid(), label:'', amount:null}); touch(); render(); return; }
  if(act === 'delinc'){ var mo = S.months[MK]; mo.income = mo.income.filter(function(i){ return i.id !== id; }); touch(); render(); return; }

  if(act === 'addcat'){
    openModal('Add a recurring bill', fieldsFor({kind:'fixed', group:'Internet', payMode:'manual'}, true), function(h){
      if(!mval(h,'name')) return false;
      S.cats.push(readCat(h, {id:uid(), active:true, note:''}));
      touch(); render();
    }, 'Add bill');
    return;
  }
  if(act === 'editcat'){
    var cat = catById(id); if(!cat) return;
    openModal('Edit bill — '+cat.name, fieldsFor(cat, true), function(h){
      if(!mval(h,'name')) return false;
      readCat(h, cat); cat.note = '';
      touch(); render();
    });
    return;
  }
  if(act === 'togglecat'){ var c2 = catById(id); if(c2){ c2.active = !c2.active; touch(); render(); } return; }
  if(act === 'delcat'){
    var c3 = catById(id); if(!c3) return;
    openModal('Delete '+c3.name+'?',
      '<p style="margin:0">This removes it from your recurring list. Lines already recorded in past months stay exactly as they are.</p>',
      function(){ S.cats = S.cats.filter(function(x){ return x.id !== id; }); touch(); render(); }, 'Delete');
    return;
  }

  /* --- autopay center --- */
  if(act === 'parsercpt'){
    var txt = ($('#rcpt')||{}).value || '';
    if(!txt.trim()){ toast('Paste a receipt first.'); return; }
    b.disabled = true; b.textContent = 'Reading…';
    post('/api/receipt/parse', {text:txt}).then(function(j){ RECEIPT = j; RECEIPT.text = txt; render(); })
      .catch(function(e2){ b.disabled=false; b.textContent='Read receipt'; toast(errMsg(e2,'Could not read that receipt.')); });
    return;
  }
  if(act === 'clearrcpt'){ RECEIPT = null; render(); return; }
  if(act === 'applyrcpt'){
    var body = {catId:$('#rc-cat').value, amount:$('#rc-amt').value, paidOn:$('#rc-date').value, ref:$('#rc-ref').value, text:RECEIPT.text};
    if(!body.catId){ toast('Choose which bill this pays.'); return; }
    applyPayment(body, b, function(){ RECEIPT = null; });
    return;
  }
  if(act === 'assign'){
    var sel = $('select[data-rev="'+id+'"]');
    var ev = AUTO.events.filter(function(x){ return String(x.id)===id; })[0];
    if(!sel || !sel.value){ toast('Choose which bill this receipt pays.'); return; }
    applyPayment({catId:sel.value, amount:ev.amount, paidOn:ev.paid_on, ref:ev.ref, eventId:ev.id}, b);
    return;
  }
  if(act === 'dismiss'){
    post('/api/events/'+id+'/dismiss').then(function(){ toast('Marked as not a bill.'); refreshAuto(); });
    return;
  }
  if(act === 'digestnow'){
    b.disabled = true;
    post('/api/automation/digest').then(function(j){
      b.disabled = false;
      toast(j.empty ? 'Nothing due or overdue — no digest needed today.' : (j.sent && j.sent.length ? 'Digest sent via '+j.sent.join(', ')+'.' : 'Digest logged here — set up phone reminders in Settings to receive it.'));
      refreshAuto();
    }).catch(function(e2){ b.disabled=false; toast(errMsg(e2,'Could not send the digest.')); });
    return;
  }

  /* --- settings --- */
  if(act === 'gentopic'){
    var rnd = ''; var cs = 'abcdefghijkmnpqrstuvwxyz23456789';
    var arr = new Uint8Array(10); (window.crypto||window.msCrypto).getRandomValues(arr);
    for(var i=0;i<arr.length;i++) rnd += cs[arr[i] % cs.length];
    $('#ntfy').value = 'starline-bills-' + rnd; return;
  }
  if(act === 'savenotif'){
    var payload = {webhookUrl:$('#hook').value, telegramChat:$('#tgchat').value};
    if(!SETTINGS.fromEnv.ntfy) payload.ntfyTopic = $('#ntfy').value;
    var tk = $('#tgtok').value; payload.telegramToken = tk ? tk : (SETTINGS.telegramTokenSet ? '__keep__' : '');
    b.disabled = true;
    post('/api/settings/automation', payload).then(function(){ b.disabled=false; toast('Reminder channels saved.'); loadSettings(); refreshAuto(); })
      .catch(function(e2){ b.disabled=false; toast(errMsg(e2,'Could not save.')); });
    return;
  }
  if(act === 'testnotif'){
    b.disabled = true;
    post('/api/automation/test').then(function(j){
      b.disabled=false;
      toast(j.errors && j.errors.length ? 'Some channels failed: '+j.errors.join('; ') : 'Test sent via '+j.sent.join(', ')+'.');
    }).catch(function(e2){ b.disabled=false; toast(errMsg(e2,'Could not send the test.')); });
    return;
  }
  if(act === 'copy'){ copyText(b.getAttribute('data-copy'), b.getAttribute('data-what')); return; }
  if(act === 'showtok'){ var tb = $('#tokbox'); if(tb){ var shown = tb.textContent.indexOf('•')<0; tb.textContent = shown ? '••••••••••••••••••••••••' : SETTINGS.ingestToken; b.textContent = shown?'Show':'Hide'; } return; }
  if(act === 'rotatetok'){
    openModal('Issue a new token?', '<p style="margin:0">The current token stops working straight away. You will need to paste the new one into the Gmail script.</p>', function(){
      post('/api/settings/automation', {rotateToken:true}).then(function(){ toast('New token issued — update the Gmail script.'); loadSettings(); })
        .catch(function(e2){ toast(errMsg(e2,'Could not issue a new token.')); });
    }, 'Issue new token');
    return;
  }
  if(act === 'getscript'){
    fetch('/downloads/gmail-forwarder.gs', {credentials:'same-origin'}).then(function(r){ return r.text(); }).then(function(src){
      src = src.replace("'PASTE_THE_INGEST_URL_HERE'", "'"+SETTINGS.ingestUrl+"'").replace("'PASTE_THE_INGEST_TOKEN_HERE'", "'"+SETTINGS.ingestToken+"'");
      openModal('Gmail receipt forwarder',
        '<ol class="steps"><li>Open <b>script.google.com</b> → <b>New project</b>.</li><li>Delete what is there and paste the script below — your address and token are already filled in.</li>'
        + '<li>Choose <b>setup</b> in the toolbar and press <b>Run</b>. Allow Gmail access when asked.</li></ol>'
        + '<textarea id="gsrc" rows="14" style="font-family:ui-monospace,monospace; font-size:11.5px" readonly>'+esc(src)+'</textarea>',
        function(){ copyText(src, 'Script'); return false; }, 'Copy script', true);
    }).catch(function(){ toast('Could not load the script.'); });
    return;
  }
  if(act === 'addfund'){
    openModal('Add a funding account', '<label class="fld"><span>Name</span><input type="text" name="fname" placeholder="e.g. Maya, Security Bank"></label>', function(h){
      var nm = mval(h,'fname'); if(!nm) return false;
      var fid = nm.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || uid();
      if(fundById(fid)) fid += '-' + uid().slice(1,5);
      S.funding.push({id:fid, name:nm, balance:null, asOf:null}); touch(); render();
    }, 'Add account');
    return;
  }
  if(act === 'delfund'){ S.funding = S.funding.filter(function(f){ return f.id !== id; }); touch(); render(); return; }

  if(act === 'repmode'){ REPMODE = b.getAttribute('data-mode'); render(); return; }
  if(act === 'csv'){ offerDownload('starline-expenses-'+(REPMODE==='year'?MK.split('-')[0]:MK)+'.csv', buildCSV(VIEW==='reports'&&REPMODE==='year'?'all':'month')); return; }
  if(act === 'json'){ offerDownload('starline-ledger-backup.json', JSON.stringify(S, null, 2)); return; }
  if(act === 'print'){ window.print(); return; }
  if(act === 'chpass'){
    openModal('Change passcode',
      '<label class="fld"><span>Current passcode</span><input type="password" name="old" autocomplete="current-password"></label>'
      + '<label class="fld"><span>New passcode <span class="hint">at least 8 characters</span></span><input type="password" name="n1" autocomplete="new-password"></label>'
      + '<label class="fld"><span>Confirm new passcode</span><input type="password" name="n2" autocomplete="new-password"></label>'
      + '<div id="cperr" style="color:var(--crit-ink); font-size:12.5px; font-weight:600" role="alert"></div>',
      function(h){
        var oldv = mval(h,'old'), n1 = mval(h,'n1'), n2 = mval(h,'n2'), err = h.querySelector('#cperr');
        if(n1.length < 8){ err.textContent = 'Use at least 8 characters.'; return false; }
        if(n1 !== n2){ err.textContent = 'The two new passcodes do not match.'; return false; }
        err.textContent = 'Saving…';
        post('/api/password', {current:oldv, next:n1})
          .then(function(){ closeModal(); toast('Passcode changed. Other signed-in devices have been signed out.'); })
          .catch(function(e2){ err.textContent = errMsg(e2, 'Could not change the passcode.'); });
        return false;
      }, 'Change passcode');
    return;
  }
  if(act === 'clearmonth'){
    openModal('Clear '+mLabel(MK)+'?',
      '<p style="margin:0">Every expense and income line recorded for '+esc(mLabel(MK))+' is removed. Your recurring bill list is not touched.</p>',
      function(){ S.months[MK] = {income:[], rows:[], note:''}; touch(); render(); toast(mLabel(MK)+' cleared.'); }, 'Clear month');
    return;
  }
}, false);

// Payments recorded on the server: save local edits first so nothing is lost,
// then reload the ledger the server just updated.
function applyPayment(body, btn, after){
  if(btn){ btn.disabled = true; }
  var go = function(){
    post('/api/receipt/apply', body).then(function(j){
      if(after) after();
      var o = j.outcome || {};
      toast('Recorded: '+(o.name||'bill')+' marked paid in '+mLabel(o.monthKey)+'.');
      return loadState().then(function(){ render(); refreshAuto(); });
    }).catch(function(e2){ if(btn) btn.disabled = false; toast(errMsg(e2, 'Could not record the payment.')); });
  };
  if(DIRTY){
    saveNow();
    var waited = 0, iv = setInterval(function(){ waited += 200; if((!DIRTY && !SAVING) || waited > 8000){ clearInterval(iv); go(); } }, 200);
  }else go();
}

document.addEventListener('change', function(e){
  var el = e.target;
  if(el.closest && el.closest('#modal-host')) return;
  var act = el.getAttribute && el.getAttribute('data-act');
  if(act === 'setmonth'){ MK = el.value; ensureMonth(MK); later(); return; }
  var f = el.getAttribute && el.getAttribute('data-f');
  if(!f) return;
  var id = el.getAttribute('data-id'), v = el.value;

  if(f === 'org'){ S.meta.org = v; touch(); return; }
  if(f === 'currency'){ S.meta.currency = v || '₱'; touch(); later(); return; }
  if(f === 'leadDays' || f === 'digestHour'){ S.automation[f] = Number(v); touch(); return; }
  if(f === 'autoCreateMonth' || f === 'notifyOnPayment'){ S.automation[f] = !!el.checked; touch(); return; }
  if(f === 'fundname'){ var fn = fundById(id); if(fn && v.trim()){ fn.name = v.trim(); touch(); } return; }
  if(f === 'fundbal'){
    var fb = fundById(id); if(!fb) return;
    fb.balance = v === '' ? null : Number(v); fb.asOf = v === '' ? null : todayISO();
    touch(); return;
  }

  var m = S.months[MK]; if(!m) return;
  if(f === 'amount' || f === 'paidOn' || f === 'method'){
    m.rows.forEach(function(r){
      if(r.id !== id) return;
      if(f === 'amount') r.amount = (v === '' ? null : Number(v));
      else r[f] = v;
      if(f === 'paidOn' && !v){ delete r.confirmedBy; }
    });
    touch(); later(); return;
  }
  if(f === 'inclabel' || f === 'incamount'){
    m.income.forEach(function(i){
      if(i.id !== id) return;
      if(f === 'inclabel') i.label = v; else i.amount = (v === '' ? null : Number(v));
    });
    touch();
    if(f === 'incamount') later();
    return;
  }
}, false);

document.addEventListener('keydown', function(e){
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); saveNow(); }
});
window.addEventListener('beforeunload', function(e){ if(DIRTY){ e.preventDefault(); e.returnValue = ''; } });

/* ============================ boot ============================ */
function pickMonth(){
  var keys = monthKeysSorted(), t = todayKey();
  if(keys.indexOf(t) !== -1) return t;
  if(keys.length) return keys[keys.length - 1];
  return t;
}
setInterval(function(){ if(DIRTY && !SAVING) saveNow(); }, 20000);
setInterval(poll, 30000);
setInterval(function(){ if(AUTHED && !document.hidden && (VIEW==='autopay' || VIEW==='dashboard')) refreshAuto(); }, 120000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden){ poll(); } });

fetch('/api/session', {credentials:'same-origin'})
  .then(function(r){ return r.json(); })
  .then(function(j){
    GATE_USER = j.username || 'admin';
    if(!j.authed) throw {code:'unauthorized'};
    return loadState().then(function(){
      AUTHED = true; MK = pickMonth(); ensureMonth(MK); render(); refreshAuto();
    });
  })
  .catch(function(){ AUTHED = false; renderGate(); });
})();
</script>
</body>
